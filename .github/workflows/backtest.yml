name: KAMA + RSI Multi-Timeframe Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        timeframe: [30m, 1h, 2h, 4h]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ${{ matrix.timeframe }} shard ${{ matrix.shard }}
        run: python backtest.py ${{ matrix.timeframe }} ${{ matrix.shard }}

      - name: Upload shard
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.timeframe }}-${{ matrix.shard }}
          path: shard_${{ matrix.timeframe }}_${{ matrix.shard }}.json
          retention-days: 1

  merge:
    needs: backtest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all shards
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          merge-multiple: true

      - name: Merge all timeframes into one zip
        run: python backtest.py merge

      - name: Upload final zip
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: backtest_results.zip
          retention-days: 30
