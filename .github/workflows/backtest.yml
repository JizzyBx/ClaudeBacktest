name: GMax Candle Analysis

on:
  workflow_dispatch:

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run shard ${{ matrix.shard }}
        run: python candle_analysis.py ${{ matrix.shard }}

      - name: Upload shard
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: shard_${{ matrix.shard }}.json
          retention-days: 1

  merge:
    needs: analyse
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all shards
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          merge-multiple: true

      - name: Merge
        run: python candle_analysis.py merge

      - name: Zip results
        run: zip candle_results.zip candle_report.json candle_summary.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: candle-results
          path: candle_results.zip
          retention-days: 30
