name: Run Backtest

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'backtest.py'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run backtest
        run: python backtest.py

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results-${{ github.run_number }}
          path: |
            backtest_report.json
            backtest_summary.txt
          retention-days: 30
