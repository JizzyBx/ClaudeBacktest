name: Backtest — 5 Variants (50 Coins, 3 Years)

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run backtest
        run: python backtest_v6.py

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: backtest-summary
          path: backtest_summary.txt
          retention-days: 30

      - name: Upload JSON report
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report-json
          path: backtest_report.json
          retention-days: 30
