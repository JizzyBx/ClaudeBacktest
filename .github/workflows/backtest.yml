name: G Max Multi-Variant Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run shard ${{ matrix.shard }}
        run: python backtest.py ${{ matrix.shard }}

      - name: Upload shard result
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: shard_${{ matrix.shard }}.json
          retention-days: 1

  merge:
    needs: backtest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all shards
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          merge-multiple: true

      - name: Merge and generate report
        run: python backtest.py merge

      - name: Zip results
        run: zip backtest_results.zip backtest_report.json backtest_summary.txt

      - name: Upload final zip
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: backtest_results.zip
          retention-days: 30
