name: InfinityX V8/V9 Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    name: "V8/V9 Backtest | ADX22 | 10x Leverage"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run V8/V9 Backtest
        run: python backtest_v8v9.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: V8V9_RESULTS
          path: |
            v8v9_summary.txt
            v8v9_report.json
