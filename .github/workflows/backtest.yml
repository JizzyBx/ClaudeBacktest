name: Backtest

on:
  workflow_dispatch: {}

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run backtest.py
        run: python backtest.py

      - name: Upload backtest_summary.txt
        uses: actions/upload-artifact@v4
        with:
          name: backtest_summary
          path: backtest_summary.txt

      - name: Upload backtest_report.json
        uses: actions/upload-artifact@v4
        with:
          name: backtest_report
          path: backtest_report.json
